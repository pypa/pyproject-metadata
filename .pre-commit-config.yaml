ci:
  autofix_prs: false
  autofix_commit_msg: "style: pre-commit fixes"
  autoupdate_commit_msg: "pre-commit: bump repositories"
  autoupdate_schedule: "monthly"

exclude: ^tests/packages/broken_license/LICENSE$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-ast
      - id: check-builtin-literals
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "f12be1ebaa5351c1fc76472de98db2c3446c8253"  # frozen: v0.16.10
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: 3a6eb0fadf60b3cccfd80bad9dbb6fae7e47b316 # frozen: v1.10.0
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

  - repo: https://github.com/adamchainz/blacken-docs
    rev: dda8db18cfc68df532abf33b185ecd12d5b7b326 # frozen: 1.20.0
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==25.*]

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "ef4a397f916211b4a39ccf9d3d9cbb6562157251"  # frozen: v3.9.9
    hooks:
      - id: prettier
        types_or: [yaml, markdown, html, css, scss, javascript, json]
        args: [--prose-wrap=always]

  - repo: https://github.com/henryiii/check-sdist
    rev: "5230295f53448dcfc8cc4a9eb00cc776ca92f964"  # frozen: v1.6.0
    hooks:
      - id: check-sdist
        args: [--inject-junk]
        additional_dependencies:
          - flit-core

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # frozen: v2.4.3
    hooks:
      - id: codespell
        exclude: ^(LICENSE$|src/scikit_build_core/resources/find_python|tests/test_skbuild_settings.py$)

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/henryiii/validate-pyproject-schema-store
    rev: ae9c8c7039f4ec4ae005660c80dbcb954f61da5a  # frozen: 2026.10.02
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 4f85d46a92dc17713078e5de73f8a13190edf6fc  # frozen: 0.38.2
    hooks:
      - id: check-dependabot
      - id: check-github-workflows
      - id: check-readthedocs
      - id: check-metaschema
        files: \.schema\.json

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
        files: "^\\.github/workflows"
        args: [--persona=pedantic]

  - repo: https://github.com/scientific-python/cookie
    rev: 1589a99867d6cac494ac7545fe6a83108580a3ee  # frozen: 2026.08.14
    hooks:
      - id: sp-repo-review
