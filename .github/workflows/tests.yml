name: tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pytest:
    name: Test Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
        python:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        include:
          - os: macos-15-intel
            python: "3.9"
          - os: macos-14
            python: "3.12"
          - os: ubuntu-latest
            python: "pypy-3.11"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up target Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Run tests
        run: uv run noxfile.py -s test-$PYTHON
        shell: bash
        env:
          PYTHON: ${{ matrix.python }}

      - name: Run minimum tests
        run: uv run noxfile.py -s minimums-$PYTHON
        shell: bash
        env:
          PYTHON: ${{ matrix.python }}

      - name: Send coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          PYTHON: ${{ matrix.python }}
        with:
          flags: tests
          env_vars: PYTHON
          name: ${{ matrix.python }}

  downstream:
    name: Downstream ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - sphinx-theme-builder
          - meson-python
          - scikit-build-core
          - pdm-backend
          - conan-py-build

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up target Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Run nox
        run: uvx nox -s "downstream(project=\"$PROJECT\")"
        env:
          PROJECT: ${{ matrix.project }}

  # https://github.com/marketplace/actions/alls-green#why
  required-checks-pass: # zizmor: ignore[anonymous-definition] required check; name must stay as the job id
    if: always()

    needs:
      - pytest
      - downstream

    runs-on: ubuntu-slim

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
